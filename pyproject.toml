[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "economic-toolkit"
version = "2.1.0"
description = "Cross-platform economic data analysis toolkit with Python API"
readme = "README.adoc"
license = {text = "MPL-2.0"}
authors = [
    {name = "Hyperpolymath Contributors", email = "noreply@hyperpolymath.org"}
]
keywords = [
    "economics",
    "data-analysis",
    "excel",
    "libreoffice",
    "fred",
    "worldbank",
    "economic-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL-2.0)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "juliacall>=0.9.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.285",
    "mypy>=1.5.0",
    "ipython>=8.14.0",
    "jupyter>=1.0.0",
]
docs = [
    "sphinx>=7.1.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/hyperpolymath/excel-economic-numbers-tool"
Documentation = "https://hyperpolymath.github.io/excel-economic-numbers-tool"
Repository = "https://github.com/hyperpolymath/excel-economic-numbers-tool"
Issues = "https://github.com/hyperpolymath/excel-economic-numbers-tool/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/python/economic_toolkit"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--cov=economic_toolkit --cov-report=html --cov-report=term"
