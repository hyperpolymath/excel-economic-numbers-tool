permissions:
  actions: read
  contents: read
name: CI/CD Pipeline
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]
env:
  JULIA_VERSION: '1.10'
  NODE_VERSION: '20'
jobs:
  lint-julia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.3
        with:
          version: ${{ env.JULIA_VERSION }}
      - name: Install JuliaFormatter
        run: julia -e 'using Pkg; Pkg.add("JuliaFormatter")'
      - name: Check Julia formatting
        run: |
          julia -e 'using JuliaFormatter; format("src/julia", verbose=true, overwrite=false) || exit(1)'
  lint-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint TypeScript
        run: npm run lint
      - name: Check Prettier formatting
        run: npx prettier --check "src/**/*.{ts,tsx,js,jsx}"
  test-julia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.3
        with:
          version: ${{ env.JULIA_VERSION }}
      - name: Cache Julia packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.julia
          key: ${{ runner.os }}-julia-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-julia-
      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run tests
        run: julia --project=. -e 'using Pkg; Pkg.test(coverage=true)'
      - name: Process coverage
        uses: julia-actions/julia-processcoverage@v1.2.2
  test-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests with coverage
        run: npm run test:coverage
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-julia, lint-typescript, test-julia, test-typescript]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.3
        with:
          version: ${{ env.JULIA_VERSION }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install Julia dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Install Node dependencies
        run: npm ci
      - name: Build TypeScript
        run: npm run build
      - name: Build Excel add-in
        run: npm run build:excel
      - name: Build LibreOffice extension
        run: npm run build:libre
      - name: Upload Excel add-in artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: excel-addin
          path: dist/officejs/
      - name: Upload LibreOffice extension artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: libreoffice-extension
          path: dist/uno/economic-toolkit.oxt
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run npm audit
        run: npm audit --production || true
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest container provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, security]
    if: github.event_name == 'release'
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download Excel add-in
        uses: actions/download-artifact@v8.0.2
        with:
          name: excel-addin
          path: dist/officejs/
      - name: Download LibreOffice extension
        uses: actions/download-artifact@v8.0.2
        with:
          name: libreoffice-extension
          path: dist/uno/
      - name: Create release assets
        run: |
          cd dist/officejs && zip -r ../../economic-toolkit-excel.zip .
          cd ../..
      - name: Upload release assets
        uses: softprops/action-gh-release@v3.0.4
        with:
          files: |
            economic-toolkit-excel.zip
            dist/uno/economic-toolkit.oxt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            economic-toolkit-excel.zip
            dist/uno/economic-toolkit.oxt
  coverage-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-julia, test-typescript]
    steps:
      - name: Coverage summary
        run: |
          echo "Coverage reports: see the lcov/cobertura artifacts from test-julia and test-typescript"
