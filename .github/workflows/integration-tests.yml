name: Integration Tests
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *' # Daily
permissions:
  actions: read
  contents: read
jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        julia-version: ['1.10']
        python-version: ['3.10', '3.11', '3.12']
        r-version: ['4.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Set up Julia ${{ matrix.julia-version }}
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v2
        with:
          version: ${{ matrix.julia-version }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up R ${{ matrix.r-version }}
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          r-version: ${{ matrix.r-version }}
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.0.x
      - name: Cache Julia packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.julia
          key: ${{ runner.os }}-julia-${{ matrix.julia-version }}-${{ hashFiles('**/Project.toml') }}
      - name: Install Julia dependencies
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Install Python package
        run: |
          pip install -e .
          pip install pytest pytest-cov
      - name: Install R package
        run: |
          Rscript -e 'install.packages("devtools")'
          Rscript -e 'devtools::install("src/R/economic.toolkit")'
      - name: Run Julia tests
        run: |
          julia --project=. tests/integration/test_e2e.jl
      - name: Run Python tests
        run: |
          pytest tests/python/ -v --cov=economic_toolkit --cov-report=xml
      - name: Run R tests
        run: |
          Rscript -e 'devtools::test("src/R/economic.toolkit")'
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          flags: integration-tests
          name: integration-tests-${{ matrix.python-version }}
      - name: Test REST API
        run: |
          # Start server in background
          julia --project=. src/julia/EconomicToolkit.jl --dev &
          SERVER_PID=$!

          # Wait for server to start
          sleep 5

          # Test health endpoint
          curl -f http://localhost:8080/health

          # Test data source listing
          curl -f http://localhost:8080/api/v1/sources

          # Stop server
          kill $SERVER_PID
      - name: Build Docker image
        run: |
          docker build -t economic-toolkit:test .
      - name: Test Docker deployment
        run: |
          docker run -d -p 8081:8080 --name test-server economic-toolkit:test
          sleep 5
          curl -f http://localhost:8081/health
          docker stop test-server
          docker rm test-server
  performance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: integration-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v2
        with:
          version: '1.10'
      - name: Run performance benchmarks
        run: |
          julia --project=. -e '
            using BenchmarkTools

            # Benchmark data fetching
            @benchmark fetch_series(FREDClient(), "GDPC1", Date(2020,1,1), Date(2023,12,31))

            # Benchmark calculations
            data = randn(10000)
            @benchmark gini_coefficient(data)
            @benchmark gdp_growth(data[1:1000])

            # Benchmark ML
            X = randn(1000, 10)
            y = randn(1000)
            @benchmark fit_linear_regression(X, y)
          '
